        .screen { display: none; }
        .screen.active { display: block; }
        .btn {
            background: #4fc3f7; color: #1a1a2e; border: none; padding: 12px 30px;
            border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background: #81d4fa; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-secondary { background: #2d4a7a; color: #eee; }
        .btn-secondary:hover { background: #3d5a8a; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #ff6b6b; }
        .btn-small { padding: 8px 16px; font-size: 0.85rem; }
        .center { text-align: center; }
        .input-group { margin: 20px 0; text-align: center; }
        .input-group label { display: block; margin-bottom: 10px; font-size: 1.1rem; }
        .input-group input, .input-group select {
            background: #0f3460; border: 2px solid #4fc3f7; color: #eee; padding: 12px 20px;
            border-radius: 8px; font-size: 1.1rem; width: 100%; max-width: 400px; outline: none; text-align: center;
        }

        .word-french { font-size: 1.4rem; font-weight: 600; color: #fff; margin-bottom: 5px; }
        .word-hint { font-size: 0.85rem; color: #666; }
        .answer-input {
            background: #0f3460; border: 2px solid #333; color: #eee; padding: 14px 20px;
            border-radius: 8px; font-size: 1.1rem; width: 100%; outline: none; margin: 15px 0; transition: border-color 0.3s;
        }
        .answer-input:focus { border-color: #4fc3f7; }
        .answer-input.correct { border-color: #2ecc71; background: #1a3d2a; }
        .answer-input.wrong { border-color: #e74c3c; background: #3d1a1a; }
        .answer-input.retype { border-color: #f39c12; background: #3d2e0a; }
        .feedback { padding: 20px; border-radius: 8px; margin: 15px 0; font-size: 1rem; display: none; }
        .feedback.show { display: block; }
        .feedback.correct { background: #1a3d2a; border: 2px solid #2ecc71; color: #2ecc71; }
        .feedback.wrong { background: #3d1a1a; border: 2px solid #e74c3c; color: #ff6b6b; }
        .feedback.retype { background: #3d2e0a; border: 2px solid #f39c12; color: #f39c12; }
        .feedback .correct-answer {
            color: #fff; font-weight: 700; font-size: 1.5rem; margin-top: 10px;
            padding: 10px; background: rgba(255,255,255,0.05); border-radius: 6px; text-align: center;
        }
        .feedback .your-answer { color: #e74c3c; font-size: 0.9rem; margin-top: 6px; text-decoration: line-through; }
        .progress-bar { background: #0f3460; border-radius: 20px; height: 8px; margin: 15px 0; overflow: hidden; }
        .progress-bar .fill { background: linear-gradient(90deg, #4fc3f7, #81d4fa); height: 100%; border-radius: 20px; transition: width 0.4s ease; }
        .stats-line { display: flex; justify-content: space-between; color: #888; font-size: 0.85rem; margin-bottom: 10px; }
        .buttons-row { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .summary-item { display: flex; justify-content: space-between; padding: 10px 15px; background: #0f3460; border-radius: 8px; margin: 8px 0; align-items: center; }
        .summary-item .fr { color: #aaa; }
        .summary-item .en { color: #4fc3f7; font-weight: 500; }
        .summary-item.was-wrong { border-left: 3px solid #e74c3c; }
        .summary-item.was-right { border-left: 3px solid #2ecc71; }
        .summary-scroll { max-height: 300px; overflow-y: auto; margin: 15px 0; }
        .global-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .stat-card { background: #0f3460; border-radius: 8px; padding: 15px; text-align: center; }
        .stat-card .value { font-size: 1.5rem; font-weight: 700; color: #4fc3f7; }
        .stat-card .label { font-size: 0.75rem; color: #888; margin-top: 4px; }
        .category-select { margin: 20px 0; }

        .mode-option {

    <div class="container">

                        <div class="mode-desc">Quand tu te trompes, la correction s'affiche et tu dois la recopier</div>
                    </label>
                    <label class="mode-option">
                        <input type="radio" name="mode" value="retype-hidden">
                        <div class="mode-title">Recopier sans correction</div>

                    </label>

                        <div class="mode-title">Classique</div>
                        <div class="mode-desc">La correction s'affiche, tu cliques suivant</div>
                    </label>
                </div>
            </div>
            <div class="input-group">
                <label for="number-input">Combien de mots/phrases pour cette serie ?</label>
                <input type="number" id="number-input" min="5" max="200" value="20">
            </div>
            <div class="center">
                <button class="btn" id="btn-start">Lancer la revision</button>
            </div>
            <div class="buttons-row" style="margin-top:20px">
                <button class="btn btn-secondary btn-small" id="btn-logout">Changer d'identifiant</button>
                <button class="btn btn-secondary btn-small" id="btn-reset">Reinitialiser mes stats</button>
            </div>

            <div class="sync-section">
                <h3>Synchroniser entre appareils :</h3>
                <div class="buttons-row" style="margin-top:5px">
                    <button class="btn btn-secondary btn-small" id="btn-export">Copier mes stats</button>
                    <button class="btn btn-secondary btn-small" id="btn-import">Importer des stats</button>
                </div>
                <textarea class="sync-textarea" id="sync-area" style="display:none;" placeholder="Colle ici le code de tes stats..."></textarea>
                <div class="buttons-row" id="import-confirm" style="display:none; margin-top:5px">
                    <button class="btn btn-small" id="btn-import-confirm">Valider l'import</button>
                </div>
                <div class="sync-msg" id="sync-msg"></div>
            </div>
        </div>

        <!-- ECRAN QUESTION -->
        <div class="screen" id="screen-quiz">
            <div class="stats-line">
                <span id="quiz-progress">1 / 20</span>
                <span id="quiz-score">0 correct</span>
            </div>
            <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>
            <div class="word-display">
                <div class="word-french" id="word-french"></div>
                <div class="word-hint" id="word-hint"></div>
            </div>
            <input type="text" class="answer-input" id="answer-input" placeholder="Tape la traduction en anglais..." autocomplete="off" spellcheck="false">
            <div class="feedback" id="feedback">
                <div id="feedback-text"></div>
                <div class="correct-answer" id="correct-answer"></div>
            </div>
            <div class="buttons-row">
                <button class="btn" id="btn-validate" style="display:block;">Valider</button>
                <button class="btn" id="btn-next" style="display:none;">Suivant</button>
                <button class="btn btn-danger" id="btn-quit">Quitter</button>
            </div>
        </div>

        <!-- ECRAN RESUME -->
        <div class="screen" id="screen-summary">
            <h2 style="margin-bottom:15px; color:#4fc3f7;">Serie terminee !</h2>
            <div class="global-stats" id="summary-stats"></div>
            <h3 style="margin:15px 0 10px; font-size:0.95rem; color:#aaa;">Detail :</h3>
            <div class="summary-scroll" id="summary-list"></div>
            <div class="buttons-row">
                <button class="btn" id="btn-home">Retour</button>
            </div>
        </div>
    </div>

// --- STATS ---
let currentUser = null;
let userStats = {};

function storageKey() { return 'rev_' + currentUser; }
function loadLocalStats() { const r = localStorage.getItem(storageKey()); return r ? JSON.parse(r) : {}; }
function saveLocalStats() { localStorage.setItem(storageKey(), JSON.stringify(userStats)); }
function getWordStat(wk) { if (!userStats[wk]) userStats[wk] = { correct: 0, wrong: 0, lastSeen: 0, streak: 0 }; return userStats[wk]; }
function wKey(word) { return word.fr + '|||' + word.en; }

function getWeight(stat) {
    const now = Date.now();
    const daysSinceSeen = stat.lastSeen ? (now - stat.lastSeen) / (1000*60*60*24) : 30;
    const total = stat.correct + stat.wrong;
    if (total === 0) return 3;
    const errorRate = stat.wrong / (total + 1);
    return 1 + errorRate * 8 + Math.min(daysSinceSeen / 3, 4) - Math.min(stat.streak * 0.3, 2);
}

function selectWords(pool, count) {
    count = Math.min(count, pool.length);
    const weighted = pool.map(w => ({ word: w, weight: Math.max(getWeight(getWordStat(wKey(w))), 0.1) }));
    const selected = [];
    const remaining = [...weighted];
    for (let i = 0; i < count; i++) {
        const totalWeight = remaining.reduce((sum, item) => sum + item.weight, 0);
        let random = Math.random() * totalWeight;
        let chosen = remaining.length - 1;
        for (let j = 0; j < remaining.length; j++) { random -= remaining[j].weight; if (random <= 0) { chosen = j; break; } }
        selected.push(remaining[chosen].word);
        remaining.splice(chosen, 1);
    }
    return selected;
}

function normalize(str) { return str.toLowerCase().trim().replace(/['']/g, "'").replace(/\s+/g, ' '); }
function checkAnswer(userAnswer, correctAnswer) {
    const norm = normalize(userAnswer);
    const correct = normalize(correctAnswer);
    if (norm === correct) return true;
    return correct.split('/').map(s => s.trim()).some(alt => norm === alt);
}
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

// --- APP STATE ---
let currentWords = [];
let currentIndex = 0;
let wrongThisRound = [];
let sessionResults = [];
let correctCount = 0;
let isRetryRound = false;
let answered = false;
let currentMode = 'retype-visible';
let phase = 'answer';

const screens = document.querySelectorAll('.screen');
function showScreen(id) { screens.forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function getCategories() { const cats = new Set(); WORDS.forEach(w => cats.add(w.cat)); return [...cats]; }

function renderHome() {
    document.getElementById('user-display').textContent = currentUser;
    let seen = 0, totalCorrect = 0, totalWrong = 0;
    WORDS.forEach(w => { const s = userStats[wKey(w)]; if (s && (s.correct + s.wrong) > 0) { seen++; totalCorrect += s.correct; totalWrong += s.wrong; } });
    document.getElementById('global-stats').innerHTML = `
        <div class="stat-card"><div class="value">${WORDS.length}</div><div class="label">Mots total</div></div>
        <div class="stat-card"><div class="value">${seen}</div><div class="label">Deja vus</div></div>
        <div class="stat-card"><div class="value">${totalCorrect + totalWrong > 0 ? Math.round(totalCorrect / (totalCorrect + totalWrong) * 100) : 0}%</div><div class="label">Taux reussite</div></div>
    `;
    document.getElementById('category-checkboxes').innerHTML = getCategories().map(c =>
        `<label><input type="checkbox" value="${c}" checked> ${c} (${WORDS.filter(w=>w.cat===c).length})</label>`
    ).join('');
    document.getElementById('sync-area').style.display = 'none';
    document.getElementById('import-confirm').style.display = 'none';
    document.getElementById('sync-msg').textContent = '';
}

function getSelectedCategories() { return [...document.querySelectorAll('#category-checkboxes input:checked')].map(cb => cb.value); }

function login() {
    const input = document.getElementById('login-input');
    const id = input.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
    if (!id) { alert('Entre un identifiant valide (lettres, chiffres, tirets)'); return; }
    currentUser = id;
    localStorage.setItem('revision_last_user', id);
    userStats = loadLocalStats();
    renderHome();
    showScreen('screen-home');
}

function logout() {
    currentUser = null;
    showScreen('screen-login');
    document.getElementById('login-input').value = '';
}

function startQuiz() {
    const count = parseInt(document.getElementById('number-input').value) || 20;
    const selectedCats = getSelectedCategories();
    const pool = WORDS.filter(w => selectedCats.includes(w.cat));
    if (pool.length === 0) { alert('Selectionne au moins une categorie !'); return; }
    currentMode = document.querySelector('input[name="mode"]:checked').value;
    currentWords = selectWords(pool, count);
    currentIndex = 0; wrongThisRound = []; sessionResults = []; correctCount = 0;
    isRetryRound = false; answered = false; phase = 'answer';
    showScreen('screen-quiz');
    showWord();
}

function showWord() {
    const word = currentWords[currentIndex];
    document.getElementById('word-french').textContent = word.fr;
    document.getElementById('word-hint').textContent = isRetryRound ? '(rattrapage)' : `Categorie : ${word.cat}`;
    const input = document.getElementById('answer-input');
    input.value = ''; input.className = 'answer-input'; input.placeholder = 'Tape la traduction en anglais...';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback-text').innerHTML = '';
    document.getElementById('correct-answer').textContent = '';
    document.getElementById('btn-validate').style.display = 'inline-block';
    document.getElementById('btn-validate').textContent = 'Valider';
    document.getElementById('btn-next').style.display = 'none';
    answered = false; phase = 'answer';
    const total = currentWords.length;
    document.getElementById('quiz-progress').textContent = `${currentIndex + 1} / ${total}`;
    document.getElementById('quiz-score').textContent = `${correctCount} correct`;
    document.getElementById('progress-fill').style.width = `${(currentIndex / total) * 100}%`;
    input.focus();
}

function validate() {
    if (phase === 'answer') {
        if (answered) return;
        answered = true;
        const word = currentWords[currentIndex];
        const input = document.getElementById('answer-input');
        const userAnswer = input.value;
        const isCorrect = checkAnswer(userAnswer, word.en);
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedback-text');
        const correctAnswerEl = document.getElementById('correct-answer');

        if (isCorrect) {
            input.className = 'answer-input correct';
            feedback.className = 'feedback correct show';
            feedbackText.textContent = 'Correct !';
            correctAnswerEl.textContent = word.en;
            correctCount++;
            if (!isRetryRound) sessionResults.push({ word, correct: true });
            const stat = getWordStat(wKey(word)); stat.correct++; stat.streak++; stat.lastSeen = Date.now(); saveLocalStats();
            document.getElementById('btn-validate').style.display = 'none';
            document.getElementById('btn-next').style.display = 'inline-block';
        } else {
            input.className = 'answer-input wrong';
            feedback.className = 'feedback wrong show';
            feedbackText.innerHTML = `Mauvaise reponse !<div class="your-answer">Ta reponse : ${userAnswer || '(vide)'}</div>`;
            correctAnswerEl.textContent = word.en;
            wrongThisRound.push(word);
            if (!isRetryRound) sessionResults.push({ word, correct: false });
            const stat = getWordStat(wKey(word)); stat.wrong++; stat.streak = 0; stat.lastSeen = Date.now(); saveLocalStats();

            if (currentMode === 'retype-visible') {
                phase = 'retype-visible';
                input.value = ''; input.className = 'answer-input retype';
                input.placeholder = 'Recopie la bonne reponse...';
                input.focus();
            } else if (currentMode === 'retype-hidden') {
                phase = 'retype-hidden-showing';
                input.value = ''; input.className = 'answer-input retype';
                input.placeholder = 'Memorise la correction puis appuie sur Entree...';
                document.getElementById('btn-validate').textContent = "J'ai memorise";
                input.focus();
            } else {
                document.getElementById('btn-validate').style.display = 'none';
                document.getElementById('btn-next').style.display = 'inline-block';
            }
        }
    } else if (phase === 'retype-visible') {
        const word = currentWords[currentIndex];
        const input = document.getElementById('answer-input');
        if (checkAnswer(input.value, word.en)) {
            input.className = 'answer-input correct';
            document.getElementById('feedback').className = 'feedback correct show';
            document.getElementById('feedback-text').textContent = 'Bien recopie !';
            document.getElementById('correct-answer').textContent = '';
            document.getElementById('btn-validate').style.display = 'none';
            document.getElementById('btn-next').style.display = 'inline-block';
            phase = 'done';
        } else {
            input.className = 'answer-input wrong'; input.value = ''; input.focus();
        }
    } else if (phase === 'retype-hidden-showing') {
        phase = 'retype-hidden';
        const input = document.getElementById('answer-input');
        input.value = ''; input.className = 'answer-input retype';
        input.placeholder = 'Retape la reponse de memoire...';
        document.getElementById('feedback').className = 'feedback retype show';
        document.getElementById('feedback-text').innerHTML = '<div class="retype-instruction">Retape la bonne reponse de memoire !</div>';
        document.getElementById('correct-answer').textContent = '';
        document.getElementById('btn-validate').textContent = 'Valider';
        input.focus();
    } else if (phase === 'retype-hidden') {
        const word = currentWords[currentIndex];
        const input = document.getElementById('answer-input');
        if (checkAnswer(input.value, word.en)) {
            input.className = 'answer-input correct';
            document.getElementById('feedback').className = 'feedback correct show';
            document.getElementById('feedback-text').textContent = 'Parfait !';
            document.getElementById('correct-answer').textContent = '';
            document.getElementById('btn-validate').style.display = 'none';
            document.getElementById('btn-validate').textContent = 'Valider';
            document.getElementById('btn-next').style.display = 'inline-block';
            phase = 'done';
        } else {
            input.className = 'answer-input wrong';
            document.getElementById('feedback').className = 'feedback wrong show';
            document.getElementById('feedback-text').innerHTML = `Pas tout a fait...<div class="your-answer">Ta reponse : ${input.value || '(vide)'}</div>`;
            document.getElementById('correct-answer').textContent = word.en;
            input.value = ''; input.placeholder = 'Memorise puis appuie sur Entree...';
            document.getElementById('btn-validate').textContent = "J'ai memorise";
            phase = 'retype-hidden-showing';
            input.focus();
        }
    }
}

function next() {
    document.getElementById('btn-validate').textContent = 'Valider';
    currentIndex++;
    if (currentIndex >= currentWords.length) {
        if (wrongThisRound.length > 0) {
            currentWords = shuffle([...wrongThisRound]); wrongThisRound = [];
            currentIndex = 0; isRetryRound = true; showWord();
        } else { showSummary(); }
    } else { showWord(); }
}

function showSummary() {
    showScreen('screen-summary');
    const total = sessionResults.length;
    const correct = sessionResults.filter(r => r.correct).length;
    document.getElementById('summary-stats').innerHTML = `
        <div class="stat-card"><div class="value">${total}</div><div class="label">Mots</div></div>
        <div class="stat-card"><div class="value">${correct}</div><div class="label">Corrects</div></div>
        <div class="stat-card"><div class="value">${total - correct}</div><div class="label">Erreurs</div></div>
    `;
    document.getElementById('summary-list').innerHTML = sessionResults.map(r => `
        <div class="summary-item ${r.correct ? 'was-right' : 'was-wrong'}">
            <span class="fr">${r.word.fr}</span>
            <span class="en">${r.word.en}</span>
        </div>
    `).join('');
}

// --- SYNC ---
function exportStats() {
    const data = btoa(unescape(encodeURIComponent(JSON.stringify(userStats))));
    const area = document.getElementById('sync-area');
    area.style.display = 'block';
    area.value = data;
    area.select();
    navigator.clipboard.writeText(data).then(() => {
        document.getElementById('sync-msg').textContent = 'Code copie dans le presse-papier !';
    }).catch(() => {
        document.getElementById('sync-msg').textContent = 'Selectionne et copie le code ci-dessus.';
    });
    document.getElementById('import-confirm').style.display = 'none';
}

function showImport() {
    const area = document.getElementById('sync-area');
    area.style.display = 'block';
    area.value = '';
    area.placeholder = 'Colle ici le code copie depuis l\'autre appareil...';
    area.focus();
    document.getElementById('import-confirm').style.display = 'flex';
    document.getElementById('sync-msg').textContent = '';
}

function confirmImport() {
    const area = document.getElementById('sync-area');
    const data = area.value.trim();
    if (!data) { document.getElementById('sync-msg').textContent = 'Colle d\'abord un code !'; return; }
    try {
        const parsed = JSON.parse(decodeURIComponent(escape(atob(data))));
        // Merge: keep the best stats (highest correct, sum wrong, latest timestamp)
        for (const key of Object.keys(parsed)) {
            if (!userStats[key]) {
                userStats[key] = parsed[key];
            } else {
                userStats[key].correct = Math.max(userStats[key].correct, parsed[key].correct);
                userStats[key].wrong = Math.max(userStats[key].wrong, parsed[key].wrong);
                userStats[key].lastSeen = Math.max(userStats[key].lastSeen, parsed[key].lastSeen);
                userStats[key].streak = Math.max(userStats[key].streak, parsed[key].streak);
            }
        }
        saveLocalStats();
        renderHome();
        document.getElementById('sync-msg').textContent = 'Stats importees et fusionnees !';
    } catch(e) {
        document.getElementById('sync-msg').textContent = 'Code invalide, verifie que tu as bien copie.';
    }
}

// --- EVENTS ---
document.getElementById('btn-login').addEventListener('click', login);
document.getElementById('login-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); login(); } });
document.getElementById('btn-logout').addEventListener('click', logout);
document.getElementById('btn-start').addEventListener('click', startQuiz);
document.getElementById('btn-validate').addEventListener('click', validate);
document.getElementById('btn-next').addEventListener('click', next);
document.getElementById('btn-home').addEventListener('click', () => { renderHome(); showScreen('screen-home'); });
document.getElementById('btn-quit').addEventListener('click', () => { if (confirm('Quitter la serie en cours ?')) { renderHome(); showScreen('screen-home'); } });
document.getElementById('btn-reset').addEventListener('click', () => {
    if (confirm('Reinitialiser toutes tes statistiques ?')) { userStats = {}; saveLocalStats(); renderHome(); }
});
document.getElementById('btn-export').addEventListener('click', exportStats);
document.getElementById('btn-import').addEventListener('click', showImport);
document.getElementById('btn-import-confirm').addEventListener('click', confirmImport);

document.getElementById('answer-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        if (phase === 'done' || (phase === 'answer' && answered)) next();
        else validate();
    }
});

// --- INIT ---
const savedUser = localStorage.getItem('revision_last_user');
if (savedUser) {
    currentUser = savedUser;
    userStats = loadLocalStats();
    renderHome();
    showScreen('screen-home');
}
</script>
